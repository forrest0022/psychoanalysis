<html lang="en">
<head>

<title>Lines of Descent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: staggered wide title top-left, small uppercase index top-right; below, the tree as outlined word-stacks joined by thin black lines. A stack opens in place across its row. */
:root{
  --paper:#F2F2EE; --ink:#0E0E0E; --link:#0038FF; --muted:#55554F; --rule:#0E0E0E;
  --wide:"Archivo", "Helvetica Neue", Arial, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--wide);font-size:16px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0}
.wrap{max-width:1320px;margin:0 auto;padding-block:40px 96px}
:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
::selection{background:var(--link);color:var(--paper)}

header{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:start;margin-bottom:56px}
h1{margin:0 0 calc(clamp(2.8rem,8.6vw,7.4rem) * -0.5);font-weight:900;font-stretch:125%;font-size:clamp(2.8rem,8.6vw,7.4rem);line-height:.9;letter-spacing:-.03em;text-transform:uppercase;transform:scaleY(.72);transform-origin:top left}
.kicker{margin:0 0 10px;color:var(--link);font-style:italic;text-transform:uppercase;font-weight:700;font-stretch:125%;font-size:clamp(1.6rem,3.6vw,2.9rem);line-height:1;letter-spacing:-.01em}
h1 span{display:block}
h1 span + span{padding-left:clamp(2.5rem,16vw,15rem)}
nav{display:flex;flex-direction:column;text-transform:uppercase;font-size:15px;font-stretch:112%;letter-spacing:.04em;line-height:1.3;padding-top:10px}
nav button{font:inherit;text-transform:inherit;letter-spacing:inherit;color:var(--ink);background:none;border:0;padding:0;text-align:left;cursor:pointer;font-weight:400}
nav button:hover,nav button.on{font-weight:700;color:var(--link)}

.scroller{overflow-x:auto;padding:0 150px 8px}
.tree{position:relative;min-width:860px;max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:72px;padding:8px 6px 16px;container-type:inline-size}
.edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;position:relative;z-index:1;align-items:start}
.node{position:relative;justify-self:center;min-width:0}
.node.freud{grid-column:2 / span 3}
.node[data-id="jung"]:not(.sel){justify-self:start;transform:translate(-140px,100px)}
.node[data-id="lacan"]:not(.sel){justify-self:end;transform:translate(140px,100px)}

.head{display:block;font:inherit;color:var(--ink);background:none;border:0;padding:0;cursor:pointer}
.stack{position:relative;display:flex;flex-direction:column;align-items:center;text-transform:uppercase;font-weight:500;font-stretch:112%;font-size:17px;line-height:1.04;letter-spacing:-.005em}
.stack svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:0}
.stack svg path{fill:var(--paper);stroke:var(--ink);stroke-width:2.4;transition:fill .12s}
.ln{position:relative;z-index:1;display:block;padding:5px 12px;white-space:nowrap;transition:color .12s}
.ln.sl{font-weight:400;text-transform:none}
.ln.kl{font-size:10.5px;font-weight:600;letter-spacing:.07em;padding-top:9px;padding-bottom:1px}
.ln.kv{font-size:13px;line-height:1.28;font-weight:400;font-stretch:100%;text-transform:none;letter-spacing:0;white-space:normal;max-width:164px;text-align:center;text-wrap:balance;padding:3px 12px 9px}
.node.side .stack svg path{stroke-dasharray:6 5}
.node.hl .stack svg path{fill:var(--ink)}
.head:hover .stack svg path{fill:var(--link);stroke:var(--link)}
.node.sel .stack svg path{fill:var(--link);stroke:var(--link)}
.head:hover .ln,.node.sel .ln,.node.hl .ln{color:var(--paper)}
@media (prefers-reduced-motion: no-preference){.node.sel .detail{animation:open .25s ease-out}@keyframes open{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}}

/* opened block */
.node.sel{grid-column:1 / -1;justify-self:stretch;display:flex;flex-direction:column;align-items:center}
.detail{position:relative;width:100%;margin-top:22px;border:2.4px solid var(--ink);border-radius:22px;background:var(--paper);padding:30px 34px 36px;color:var(--ink);font-size:17px;line-height:1.65;text-align:left}
.x{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);color:var(--ink);font:500 20px/1 var(--wide);cursor:pointer}
.x:hover{background:var(--link);border-color:var(--link);color:var(--paper)}
.detail h2{font-weight:500;font-stretch:112%;text-transform:uppercase;font-size:1.65rem;line-height:1.05;letter-spacing:-.01em;margin:0 56px 14px 0}
.change{margin:0 0 22px;padding:18px 22px;border-radius:16px;background:var(--link);color:var(--paper)}
.change .lab{display:block;font-size:12px;font-weight:600;font-stretch:112%;text-transform:uppercase;letter-spacing:.07em;margin:0 0 6px;opacity:.85}
.change p{margin:0;font-size:clamp(1.35rem,2.6vw,1.9rem);font-weight:500;font-stretch:112%;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
.dgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:0 48px}
@container (max-width: 820px){.dgrid{grid-template-columns:minmax(0,1fr)}.dcol + .dcol{margin-top:8px}}
.dcol{min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 18px}
.tag{font-size:12.5px;font-stretch:112%;text-transform:uppercase;letter-spacing:.05em;border:1.6px solid var(--ink);border-radius:999px;padding:3px 11px;white-space:nowrap}
.tag.fill{background:var(--link);border-color:var(--link);color:var(--paper)}
.place{font-size:15.5px;margin:0 0 16px}
.lede{margin:0;font-size:18px;line-height:1.62;max-width:62ch}
.detail h3{font-size:13px;font-weight:600;font-stretch:112%;text-transform:uppercase;letter-spacing:.06em;margin:32px 0 12px;padding-top:20px;border-top:1.6px solid var(--ink)}
.dcol > h3:first-child{margin-top:0;padding-top:0;border-top:0}
.detail ul.ideas{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px;font-size:16.5px}
.list{display:flex;flex-direction:column;border:1.6px solid var(--ink);border-radius:14px;overflow:hidden}
.trow{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;font:500 16px var(--wide);text-align:left;color:var(--ink);background:none;border:0;border-bottom:1.2px solid var(--ink);padding:12px 16px;cursor:pointer}
.trow:last-child{border-bottom:0}
.trow:hover{background:var(--link);color:var(--paper)}
.trow .d{font-size:13px;white-space:nowrap;opacity:.75}
.texts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:11px 16px;font-size:16px;line-height:1.5;margin:0}
.texts dt{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;padding-top:1px}
.texts dd{margin:0}
.texts .by{color:var(--muted);font-size:15px}
.concepts{margin:0;display:flex;flex-direction:column;gap:18px}
.concepts div{padding-left:14px;border-left:2.4px solid var(--ink)}
.concepts dt{font-weight:600;font-size:16.5px;margin:0 0 4px}
.concepts dd{margin:0;font-size:16px;line-height:1.65}
.links{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.links .lab{flex-basis:100%;font-size:12.5px;font-weight:600;font-stretch:112%;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.chip{font:500 14px var(--wide);font-stretch:112%;text-transform:uppercase;letter-spacing:.02em;color:var(--ink);background:none;border:1.6px solid var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.chip:hover{background:var(--link);border-color:var(--link);color:var(--paper)}
.back{font:500 14px var(--wide);font-stretch:112%;text-transform:uppercase;letter-spacing:.04em;color:var(--ink);background:none;border:0;padding:0;margin:0 0 16px;cursor:pointer}
.back{color:var(--link)}
.back:hover{text-decoration:underline}
.dates{font-size:14px;margin:0 0 14px;color:var(--muted)}
/* compare */
@property --spin{syntax:"<angle>";inherits:false;initial-value:0deg}
.fab .glow{position:relative;isolation:isolate;background:var(--ink);color:var(--paper)}
.fab .glow:hover{background:var(--link);border-color:var(--link);color:var(--paper)}
.fab .glow::after{content:"";position:absolute;inset:-2.4px;border-radius:999px;padding:2.4px;background:conic-gradient(from var(--spin), transparent 0 52%, var(--link) 96%, transparent 96%);-webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 2.4s linear infinite;pointer-events:none}
@keyframes spin{to{--spin:360deg}}
@media (prefers-reduced-motion: reduce){.fab .glow::after{animation:none;background:var(--link)}}
.fab{position:fixed;right:calc(20px + env(safe-area-inset-right, 0px));bottom:calc(20px + env(safe-area-inset-bottom, 0px));z-index:20;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;align-items:center;max-width:calc(100vw - 40px)}
.fab button,.fab .hint{font:600 14px var(--wide);font-stretch:112%;text-transform:uppercase;letter-spacing:.05em;border:2.4px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:999px;padding:12px 20px;white-space:nowrap}
.fab button{cursor:pointer}
.fab button:hover{background:var(--ink);color:var(--paper)}
.fab .primary{background:var(--link);border-color:var(--link);color:var(--paper)}
.fab .primary:hover{background:var(--ink);border-color:var(--ink)}
.fab .hint{font-weight:500;border-style:dashed}
.node.pick .stack svg path{fill:var(--link);stroke:var(--link)}
.node.pick .ln{color:var(--paper)}
.pk{position:absolute;top:-12px;right:-12px;z-index:3;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--paper);font:600 13px var(--wide);display:grid;place-items:center;pointer-events:none}
body.picking .head{cursor:cell}
.cmpwrap{border:2.4px solid var(--ink);border-radius:22px;background:var(--paper);margin:0 0 56px;padding:26px 0 8px;position:relative}
.cmptop{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:0 28px 18px}
.cmptop h2{margin:0;font-weight:500;font-stretch:112%;text-transform:uppercase;font-size:1.65rem;letter-spacing:-.01em}
.cmptop .acts{display:flex;gap:8px;align-items:center}
.cmptop .acts button{font:600 13px var(--wide);font-stretch:112%;text-transform:uppercase;letter-spacing:.05em;border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer}
.cmptop .acts button:hover{background:var(--link);border-color:var(--link);color:var(--paper)}
.cmpscroll{overflow-x:auto}
.cmp{display:grid;min-width:min-content}
.cmp > div{padding:14px 18px;border-top:1.6px solid var(--ink);font-size:15.5px;line-height:1.55;min-width:0}
.cmp > div + div:not(.lab){border-left:1.2px solid var(--ink)}
.cmp .lab{position:sticky;left:0;z-index:1;background:var(--paper);font-size:12.5px;font-weight:600;font-stretch:112%;text-transform:uppercase;letter-spacing:.06em;padding-left:28px}
.cmp .colhead{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.cmp .colname{background:var(--link);color:var(--paper);border-radius:14px;padding:8px 14px;font-weight:500;font-stretch:112%;text-transform:uppercase;font-size:17px;line-height:1.1}
.cmp .colyr{font-size:14px;color:var(--muted)}
.cmp .colrm{font:500 12.5px var(--wide);font-stretch:112%;text-transform:uppercase;letter-spacing:.05em;background:none;border:0;padding:0;color:var(--link);cursor:pointer}
.cmp .colrm:hover{text-decoration:underline}
.cmp ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.cmp dl{margin:0;display:flex;flex-direction:column;gap:10px}
.cmp dt{font-weight:600}
.cmp dd{margin:0}
.cmp .yr{font-weight:600;font-variant-numeric:tabular-nums;margin-right:6px}
.cmp .none{color:var(--muted)}
@media (max-width: 640px){header{grid-template-columns:minmax(0,1fr)} nav{padding-top:0}}
</style>

const COAST=new Set(["self-psychology","relational","intersubjective"]);
const STACK={"american-or":["American","object","relations"],ferenczi:["Budapest","school"],independents:["British","object","relations"],"field-theory":["Contemporary","Bionians"],"ego-psychology":["Ego","psychology"],"self-psychology":["Self","psychology"]};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const treeEl=document.getElementById("tree"), edgesEl=document.getElementById("edges");
const chip=k=>`<button type="button" class="chip" data-go="${k}">${esc(N[k].name)}</button>`;

function nodeDetail(id){
  const n=N[id], up=n.parents, down=kids(id), [place,reg]=P[id], infIn=n.infl||[], infOut=ids.filter(k=>(N[k].infl||[]).includes(id));
  return `<h2>${esc(n.full)}</h2>
    ${KEY[id]?`<div class="change"><span class="lab">${KEYLAB}</span><p>${esc(KEY[id][0]+" "+KEY[id][1])}</p></div>`:""}
    <div class="meta"><span class="tag fill">${esc(n.yrs)}</span>${COAST.has(id)?reg.split(" · ").map(r=>`<span class="tag">${esc(r)}</span>`).join(""):""}</div>
    ${COAST.has(id)&&place?`<p class="place">${esc(place)}</p>`:""}
    <div class="dgrid">
    <div class="dcol">
      <p class="lede">${esc(n.sum)}</p>
      <h3>What makes it distinct</h3>
      <ul class="ideas">${n.dist.map(d=>`<li>${esc(d)}</li>`).join("")}</ul>
      <h3>Core concepts</h3>
      <dl class="concepts">${n.co.map(c=>`<div><dt>${esc(C[c][0])}</dt><dd>${esc(C[c][1])}</dd></div>`).join("")}</dl>
    </div>
    <div class="dcol">
      <h3>Key thinkers</h3>
      <div class="list">${n.th.map(t=>`<button type="button" class="trow" data-th="${t}"><span>${esc(T[t][0])}</span><span class="d">${esc(T[t][1])} →</span></button>`).join("")}</div>
      <h3>Key texts</h3>
      <dl class="texts">${n.tx.map(([y,ti,by])=>`<dt>${y}</dt><dd><i>${esc(ti)}</i> <span class="by">· ${esc(by)}</span></dd>`).join("")}</dl>
      <h3>On the tree</h3>
      ${up.length?`<div class="links"><span class="lab">Descends from</span>${up.map(chip).join("")}</div>`:""}
      ${infIn.length?`<div class="links"><span class="lab">Influenced by</span>${infIn.map(chip).join("")}</div>`:""}
      ${down.length?`<div class="links"><span class="lab">Leads to</span>${down.map(chip).join("")}</div>`:""}
      ${infOut.length?`<div class="links"><span class="lab">Influenced</span>${infOut.map(chip).join("")}</div>`:""}
      ${!down.length&&!infOut.length?`<p style="margin:0">The end of this branch.</p>`:""}
    </div></div>`;
}
function thinkerDetail(t,from){
  const [name,dates,blurb,ideas,works]=T[t];
  const appears=ids.filter(k=>N[k].th.includes(t));
  return `<button type="button" class="back" data-backto>← ${esc(N[from].full)}</button>
    <h2>${esc(name)}</h2>
    ${dates?`<p class="dates">${esc(dates)}</p>`:""}
    <div class="dgrid"><div class="dcol">
      <p class="lede">${esc(blurb)}</p>
      <h3>Key ideas</h3>
      <ul class="ideas">${ideas.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>
    </div><div class="dcol">
      <h3>Key works</h3>
      <dl class="texts">${works.map(([y,ti])=>`<dt>${y}</dt><dd><i>${esc(ti)}</i></dd>`).join("")}</dl>
      <h3>On the tree</h3>
      <div class="links"><span class="lab">Appears in</span>${appears.map(chip).join("")}</div>
    </div></div>`;
}

function stackLines(k){
  const words=STACK[k]||N[k].name.split(" ");
  return words.map(w=>`<span class="ln">${esc(w)}</span>`).join("")+`<span class="ln sl">${esc(N[k].yrs)}</span>`;
}

function renderTree(scrollTo){
  treeEl.querySelectorAll(".row").forEach(r=>r.remove());
  for(let g=0; g<GENS.length; g++){
    const inGen=ids.filter(k=>N[k].gen===g);
    if(!inGen.length) continue;
    const row=document.createElement("div"); row.className="row";
    inGen.sort((a,b)=>N[a].col-N[b].col).forEach(k=>{
      const n=N[k], sel=k===selected;
      const el=document.createElement("div");
      el.className="node"+(n.side?" side":"")+(sel?" sel":"")+(picks.includes(k)?" pick":"")+(k==="freud"?" freud":"")+(hlLine&&LINE[k]===hlLine?" hl":"");
      el.dataset.id=k;
      if(k!=="freud" && !sel) el.style.gridColumn=n.span?`${n.col+1} / span ${n.span}`:String(n.col+1);
      el.innerHTML=(picks.includes(k)?`<span class="pk">${picks.indexOf(k)+1}</span>`:"")+`<button type="button" class="head" data-head="${k}" aria-expanded="${sel}" aria-label="${esc(n.full)}"><span class="stack"><svg aria-hidden="true"><path/></svg>${stackLines(k)}</span></button>
        ${sel?`<div class="detail"><button type="button" class="x" data-close aria-label="Close">×</button>${view.t==="thinker"?thinkerDetail(view.id,k):nodeDetail(k)}</div>`:""}`;
      row.appendChild(el);
    });
    treeEl.appendChild(row);
  }
  requestAnimationFrame(()=>{ layout();
    if(scrollTo){const el=treeEl.querySelector(`[data-id="${scrollTo}"]`); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});}
  });
}

function rounded(pts,r){
  const n=pts.length; let d="";
  for(let i=0;i<n;i++){
    const p=pts[(i-1+n)%n], v=pts[i], q=pts[(i+1)%n];
    const l1=Math.hypot(p[0]-v[0],p[1]-v[1]), l2=Math.hypot(q[0]-v[0],q[1]-v[1]);
    const d1=Math.min(r,l1/2), d2=Math.min(r,l2/2);
    const a=[v[0]+(p[0]-v[0])/l1*d1, v[1]+(p[1]-v[1])/l1*d1], b=[v[0]+(q[0]-v[0])/l2*d2, v[1]+(q[1]-v[1])/l2*d2];
    d+=(i?"L":"M")+a[0].toFixed(1)+","+a[1].toFixed(1)+" Q"+v[0].toFixed(1)+","+v[1].toFixed(1)+" "+b[0].toFixed(1)+","+b[1].toFixed(1)+" ";
  }
  return d+"Z";
}
function outline(stack){
  const R=[...stack.querySelectorAll(".ln")].map(l=>({x0:l.offsetLeft,x1:l.offsetLeft+l.offsetWidth,y0:l.offsetTop,y1:l.offsetTop+l.offsetHeight}));
  if(!R.length) return;
  let pts=[[R[0].x0,R[0].y0],[R[0].x1,R[0].y0]];
  R.forEach((r,i)=>{ pts.push([r.x1,r.y1]); if(i<R.length-1) pts.push([R[i+1].x1,r.y1]); });
  const last=R[R.length-1]; pts.push([last.x0,last.y1]);
  for(let i=R.length-1;i>0;i--){ pts.push([R[i].x0,R[i].y0]); pts.push([R[i-1].x0,R[i].y0]); }
  const clean=[];
  pts.forEach(p=>{ const q=clean[clean.length-1]; if(!q||Math.abs(q[0]-p[0])>.5||Math.abs(q[1]-p[1])>.5) clean.push(p); });
  if(clean.length>1){const f=clean[0],l=clean[clean.length-1]; if(Math.abs(f[0]-l[0])<.5&&Math.abs(f[1]-l[1])<.5) clean.pop();}
  const col=[];
  for(let i=0;i<clean.length;i++){ const p=clean[(i-1+clean.length)%clean.length], v=clean[i], q=clean[(i+1)%clean.length];
    if((Math.abs(p[0]-v[0])<.5&&Math.abs(v[0]-q[0])<.5)||(Math.abs(p[1]-v[1])<.5&&Math.abs(v[1]-q[1])<.5)) continue; col.push(v); }
  stack.querySelector("svg path").setAttribute("d",rounded(col,13));
}

function layout(){ treeEl.querySelectorAll(".stack").forEach(outline); drawEdges(); }

function wave(x1,y1,x2,y2){
  const lift=Math.min(70,Math.abs(x2-x1)*0.18);
  const c1x=x1+(x2-x1)*0.35, c2x=x1+(x2-x1)*0.75, top=Math.min(y1,y2)-lift;
  return `M${x1.toFixed(1)},${y1.toFixed(1)} C${c1x.toFixed(1)},${top.toFixed(1)} ${c2x.toFixed(1)},${top.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}`;
}
function drawEdges(){
  const box=treeEl.getBoundingClientRect();
  const pos=id=>{const el=treeEl.querySelector(`[data-id="${id}"]`); if(!el) return null;
    const h=el.querySelector(".stack").getBoundingClientRect(), o=el.getBoundingClientRect(), f=el.querySelector(".ln").getBoundingClientRect();
    return {x:h.left-box.left+h.width/2, top:h.top-box.top, bot:o.bottom-box.top, fy:f.top-box.top+f.height/2, fl:f.left-box.left, fr:f.right-box.left};};
  let s="";
  ids.forEach(c=>{
    const cp=pos(c); if(!cp) return;
    (N[c].infl||[]).forEach(p=>{ const pp=pos(p); if(!pp) return;
      const on=selected===c||selected===p, st=on?"var(--link)":"var(--ink)", sw=on?2.4:1.6, span=N[c].gen-N[p].gen;
      let d;
      if(span>1){ const xg=(pp.x+cp.x)/2, g=36; d=`M${pp.x},${pp.bot} C${pp.x},${pp.bot+g} ${xg},${pp.bot} ${xg},${pp.bot+g} L${xg},${cp.top-g} C${xg},${cp.top} ${cp.x},${cp.top-g} ${cp.x},${cp.top}`; }
      else { const my=(pp.bot+cp.top)/2; d=`M${pp.x},${pp.bot} C${pp.x},${my} ${cp.x},${my} ${cp.x},${cp.top}`; }
      s+=`<path d="${d}" fill="none" stroke="${st}" stroke-width="${sw}" stroke-dasharray="3 5" stroke-linecap="round"/>`;});
    N[c].parents.forEach(p=>{ const pp=pos(p); if(!pp) return;
      const dash=N[c].side?' stroke-dasharray="0.1 6" stroke-linecap="round"':'', on=selected===c||selected===p, st=on?"var(--link)":"var(--ink)", sw=on?2.4:(N[c].side?2.4:1.6);
      const my=(pp.bot+cp.top)/2;
      s+=`<path d="M${pp.x},${pp.bot} C${pp.x},${my} ${cp.x},${my} ${cp.x},${cp.top}" fill="none" stroke="${st}" stroke-width="${sw}"${dash}/>`;});
  });
  edgesEl.innerHTML=s;
}

function setHash(k){ try{ history.replaceState(null,"",k?"#"+k:location.pathname+location.search);}catch(e){} }
function openNode(k){ selected=k; view={t:"node",id:k}; setHash(k); renderTree(k); }
function closeNode(){ const k=selected; selected=null; view=null; setHash(null); renderTree(); const h=treeEl.querySelector(`[data-head="${k}"]`); if(h) h.focus({preventScroll:true}); }

treeEl.addEventListener("click",e=>{
  const t=e.target;
  const head=t.closest("[data-head]"); if(head){ const k=head.dataset.head; if(picking){ const i=picks.indexOf(k); if(i>-1) picks.splice(i,1); else picks.push(k); renderTree(); renderFab(); return; } if(selected===k) closeNode(); else openNode(k); return; }
  if(t.closest("[data-close]")){ closeNode(); return; }
  const th=t.closest("[data-th]"); if(th){ view={t:"thinker",id:th.dataset.th}; renderTree(selected); return; }
  if(t.closest("[data-backto]")){ view={t:"node",id:selected}; renderTree(selected); return; }
  const go=t.closest("[data-go]"); if(go){ openNode(go.dataset.go); return; }
});
document.addEventListener("keydown",e=>{ if(e.key!=="Escape") return; if(picking){ stopPicking(); return; } if(selected) closeNode(); });

const fab=document.getElementById("fab"), cmpEl=document.getElementById("cmp");
const NAV={origins:"Origins",british:"Kleinian and British",relational:"Interpersonal and relational",self:"Ego and self psychology",side:"Others"};
function renderFab(){
  document.body.classList.toggle("picking",picking);
  if(!picking){ fab.innerHTML=`<button type="button" class="glow" data-fab="start">Compare</button>`; return; }
  const n=picks.length;
  fab.innerHTML=(n<2?`<span class="hint">Pick ${n?"one more":"two or more"}</span>`:`<button type="button" class="primary" data-fab="show">Compare ${n}</button>`)
    +(n?`<button type="button" data-fab="clear">Clear</button>`:"")+`<button type="button" data-fab="cancel">Cancel</button>`;
}
function startPicking(){ picking=true; if(selected){ selected=null; view=null; setHash(null); } renderTree(); renderFab(); }
function stopPicking(){ picking=false; if(cmpEl.hidden) picks=[]; renderTree(); renderFab(); }
fab.addEventListener("click",e=>{
  const b=e.target.closest("[data-fab]"); if(!b) return;
  const a=b.dataset.fab;
  if(a==="start") startPicking();
  else if(a==="cancel") stopPicking();
  else if(a==="clear"){ picks=[]; renderTree(); renderFab(); }
  else if(a==="show"){ picking=false; renderCompare(); renderTree(); renderFab(); cmpEl.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"}); }
});
function renderCompare(){
  if(picks.length<2){ cmpEl.hidden=true; cmpEl.innerHTML=""; return; }
  const cols=picks.map(k=>N[k]);
  const anyCoast=picks.some(k=>COAST.has(k));
  const row=(label,fn)=>`<div class="lab">${label}</div>`+picks.map(k=>`<div>${fn(k,N[k])}</div>`).join("");
  const list=a=>a.length?`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:`<span class="none">None</span>`;
  const names=a=>a.length?a.map(k=>esc(N[k].name)).join(", "):`<span class="none">None</span>`;
  let h=`<div class="lab"></div>`+picks.map(k=>`<div class="colhead"><span class="colname">${esc(N[k].name)}</span><span class="colyr">${esc(N[k].yrs)}</span><button type="button" class="colrm" data-rm="${k}">Remove</button></div>`).join("");
  h+=row("How change happens",k=>KEY[k]?`<b>${esc(KEY[k][0]+" "+KEY[k][1])}</b>`:"");
  h+=row("Line",k=>esc(NAV[LINE[k]]));
  if(anyCoast) h+=row("Where",k=>COAST.has(k)?`${P[k][0]?esc(P[k][0])+"<br>":""}<b>${esc(P[k][1])}</b>`:`<span class="none">—</span>`);
  h+=row("Descends from",(k,n)=>names(n.parents)+((n.infl||[]).length?`<br><span class="none">Influenced by</span> ${names(n.infl)}`:""));
  h+=row("In brief",(k,n)=>esc(n.sum));
  h+=row("What makes it distinct",(k,n)=>list(n.dist));
  h+=row("Core concepts",(k,n)=>`<dl>${n.co.map(c=>`<div><dt>${esc(C[c][0])}</dt><dd>${esc(C[c][1])}</dd></div>`).join("")}</dl>`);
  h+=row("Key thinkers",(k,n)=>list(n.th.map(t=>T[t][0])));
  h+=row("Key texts",(k,n)=>`<dl>${n.tx.map(([y,ti,by])=>`<div><span class="yr">${y}</span><i>${esc(ti)}</i> <span class="none">· ${esc(by)}</span></div>`).join("")}</dl>`);
  cmpEl.innerHTML=`<div class="cmptop"><h2>Compare</h2><div class="acts"><button type="button" data-cmp="edit">Add or remove</button><button type="button" data-cmp="close" aria-label="Close comparison">Close ×</button></div></div>
    <div class="cmpscroll"><div class="cmp" style="grid-template-columns:minmax(150px,170px) repeat(${cols.length}, minmax(260px,1fr))">${h}</div></div>`;
  cmpEl.hidden=false;
}
cmpEl.addEventListener("click",e=>{
  const rm=e.target.closest("[data-rm]"); if(rm){ picks=picks.filter(k=>k!==rm.dataset.rm); renderCompare(); renderTree(); renderFab(); return; }
  const a=e.target.closest("[data-cmp]"); if(!a) return;
  if(a.dataset.cmp==="close"){ cmpEl.hidden=true; cmpEl.innerHTML=""; picks=[]; picking=false; renderTree(); renderFab(); }
  else { picking=true; renderTree(); renderFab(); document.getElementById("tree").scrollIntoView({behavior:"smooth",block:"start"}); }
});
renderFab();

const navBtns=[...document.querySelectorAll("nav [data-line]")];
function applyHl(){ treeEl.querySelectorAll(".node").forEach(el=>el.classList.toggle("hl",!!hlLine&&LINE[el.dataset.id]===hlLine)); navBtns.forEach(b=>b.classList.toggle("on",b.dataset.line===hlLine)); }
let pinned=null;
navBtns.forEach(b=>{
  b.addEventListener("mouseenter",()=>{hlLine=b.dataset.line; applyHl();});
  b.addEventListener("mouseleave",()=>{hlLine=pinned; applyHl();});
  b.addEventListener("click",()=>{pinned=pinned===b.dataset.line?null:b.dataset.line; hlLine=pinned; applyHl();});
});

function fromHash(){ const h=decodeURIComponent((location.hash||"").slice(1)); if(N[h]){ if(selected!==h) openNode(h); return true; } return false; }
window.addEventListener("hashchange",fromHash);
if(!fromHash()) renderTree();
new ResizeObserver(()=>layout()).observe(treeEl);
if(document.fonts) document.fonts.ready.then(layout);
</script>

</body>
