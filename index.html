<script>
(function(){
 const h0=decodeURIComponent((location.hash||"").slice(1)); if(h0){ location.replace("schools.html#"+encodeURIComponent(h0)); return; }
 const f=v=>v.toFixed(1);
 const lt=x=>50-(90-x)*40/70+8, lb=x=>180+(90-x)*105/90-4;
 const LP=(x,t)=>f(x)+' '+f(lt(x)+(lb(x)-lt(x))*t);
 const xa=10,xb=58;
 let s=`<path d="M${LP(xa,0)} L${LP(xb,0)} L${LP(xb,1)} L${LP(xa,1)} Z"/>`;
 for(let i=1;i<6;i++) s+=`<path class="ln" d="M${LP(xa,i/6)} L${LP(xb,i/6)}"/>`;
 for(let i=0;i<6;i++){const t0=i/6,t1=(i+1)/6;let x=xb-4,sd=i*7+3;while(x>xa+5){sd=(sd*37+11)%17;const w=1.6+(sd%4),h=.55+(sd%5)/10;s+=`<path class="ln" d="M${LP(x,t1)} L${LP(x,t1-(t1-t0)*h)}" stroke-width="1"/>`;x-=w+.8;if(sd%6===0)x-=5;}}
 document.getElementById('shelf').innerHTML=s;
 const rt=x=>50-(x-290)*40/70, rb=x=>180+(x-290)*105/90;
 const RP=(u,v)=>{const x=318+u*46; const t=0.2+v*0.3; return [x, rt(x)+(rb(x)-rt(x))*t];};
 const Q=(u,v)=>RP(u,v).map(f).join(' ');
 let a=`<path d="M${Q(0,0)} L${Q(1,0)} L${Q(1,1)} L${Q(0,1)} Z"/>`;
 a+=`<path class="ln" d="M${Q(.08,.08)} L${Q(.92,.08)} L${Q(.92,.92)} L${Q(.08,.92)} Z" stroke-width=".8"/>`;
 let sd=5, pts=[], u=.5, v=.5;
 for(let i=0;i<46;i++){sd=(sd*9301+49297)%233280; const r1=sd/233280; sd=(sd*9301+49297)%233280; const r2=sd/233280;
  u=Math.min(.86,Math.max(.14,u+(r1-.5)*.34)); v=Math.min(.86,Math.max(.14,v+(r2-.5)*.34)); pts.push(RP(u,v));}
 let d=`M${f(pts[0][0])} ${f(pts[0][1])}`;
 for(let i=1;i<pts.length-1;i++){const m=[(pts[i][0]+pts[i+1][0])/2,(pts[i][1]+pts[i+1][1])/2]; d+=` Q${f(pts[i][0])} ${f(pts[i][1])} ${f(m[0])} ${f(m[1])}`;}
 a+=`<path class="ln" d="${d}" stroke-width=".8"/>`;
 document.getElementById('art').innerHTML=a;
 const objs=[...document.querySelectorAll('.f')], menu=[...document.querySelectorAll('.site .menu a')];
 const set=h=>{objs.forEach(o=>o.classList.toggle('on',o.dataset.href===h)); menu.forEach(m=>m.classList.toggle('on',m.getAttribute('href')===h));};
 [...objs,...menu].forEach(el=>{const h=el.dataset.href||el.getAttribute('href');
  el.addEventListener('mouseenter',()=>set(h)); el.addEventListener('mouseleave',()=>set(null));
  el.addEventListener('focus',()=>set(h)); el.addEventListener('blur',()=>set(null));});
})();
</script>
