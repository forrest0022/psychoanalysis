<!doctype html><html><head><meta charset="utf-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="A map of psychoanalysis: the schools that grew out of one another, and the analysts who lay down on one another's couches."><meta name="viewport" content="width=device-width,initial-scale=1"><title>Psychoanalysis Maps</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
:root{--ink:#0E0E0E;--pink:#EF82C8;--muted:#77776F}
body{margin:0;background:#fff;color:var(--ink);font-family:Archivo,"Helvetica Neue",Arial,sans-serif;padding:32px 16px 48px}
.br{font-weight:800;text-transform:uppercase;font-size:1.1rem;letter-spacing:.01em;max-width:1300px;margin:0 auto 24px}
.grid{max-width:1300px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.c{border:1px solid #E4E4DF;display:flex;flex-direction:column;align-items:center;padding:12px 12px 22px}
canvas{width:100%;aspect-ratio:1;display:block}
h2{margin:6px 0 4px;font-weight:800;font-stretch:88%;font-size:1.4rem;letter-spacing:.04em}
p{margin:0;color:var(--muted);font-size:14px;text-align:center;line-height:1.4}
html,body{height:100%}body{padding:0}
.br{position:fixed;left:max(16px,4vw);top:32px;margin:0}
main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh}
main canvas{width:min(46vmin,380px);min-width:200px}
.ent{font-weight:800;font-stretch:100%;font-size:clamp(1.6rem,3vw,2.6rem);letter-spacing:.01em;border-bottom:3px solid #0038FF;line-height:1;color:#0038FF;text-decoration:none}
.ent:hover,.ent:focus-visible{animation:flash .22s steps(1,end) infinite}
@keyframes flash{0%{color:#0038FF;border-color:#0038FF}50%{color:var(--ink);border-color:var(--ink)}}
@media (prefers-reduced-motion: reduce){.ent:hover{animation:none;color:var(--ink);border-color:var(--ink)}}

.kl{display:block}
</style></head><body>
<script>(function(){const h=decodeURIComponent((location.hash||"").slice(1)); if(h) location.replace("schools.html#"+encodeURIComponent(h));})();</script>
<div class="br">Psychoanalysis <span style="font-weight:400">Maps</span></div>
<main><a href="analysts.html" class="kl" aria-label="Enter"><canvas data-k="matte"></canvas></a><a class="ent" href="analysts.html">ENTER</a></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const PINK=new THREE.Color(0xFF5A1F).convertSRGBToLinear();
const a=2.15,b=1.15,tube=.42,SEG=320,RAD=40,SPD=[.000055,.000043,.000049];
class Ell extends THREE.Curve{constructor(f){super();this.f=f;}getPoint(t){const u=t*2*Math.PI;return this.f(a*Math.cos(u),b*Math.sin(u));}}
const curves=[new Ell((x,y)=>new THREE.Vector3(x,y,0)),new Ell((x,y)=>new THREE.Vector3(0,x,y)),new Ell((x,y)=>new THREE.Vector3(y,0,x))];
function seamTex(){const c=document.createElement("canvas");c.width=2048;c.height=8;const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,2048,8);g.fillStyle="#000";g.fillRect(1012,0,24,8);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;}
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function make(cv){
  const kind=cv.dataset.k, R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:false});
  R.setPixelRatio(Math.min(2,devicePixelRatio)); R.setClearColor(0xffffff); R.physicallyCorrectLights=true; R.outputEncoding=THREE.sRGBEncoding; R.toneMapping=THREE.ACESFilmicToneMapping;
  const S=new THREE.Scene(), cam=new THREE.PerspectiveCamera(32,1,.1,100); cam.position.set(0,.4,12.5);
  S.add(new THREE.HemisphereLight(0xffffff,0xd8d6d0,2.2));
  const key=new THREE.DirectionalLight(0xffffff,3.6); key.position.set(-4,6,7); S.add(key);
  const rim=new THREE.DirectionalLight(0xffffff,1.2); rim.position.set(5,-2,-4); S.add(rim);
  if(kind!=="matte"){ const E=new THREE.Scene(); E.background=new THREE.Color(0x8a8a90);
    [[0,6,0,10,.3,10,8],[-6,1,2,.3,6,6,4],[6,2,-2,.3,5,8,3],[0,-5,0,12,.3,12,.6],[2,1,7,4,4,.3,2.5]].forEach(([x,y,z,w,h,d,e])=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshBasicMaterial({color:new THREE.Color(e,e,e)}));m.position.set(x,y,z);E.add(m);});
    S.environment=new THREE.PMREMGenerator(R).fromScene(E,.04).texture; }
  const knot=new THREE.Group(); knot.rotation.set(.6,.3,0); S.add(knot);
  const rings=curves.map((c,i)=>{ const tex=seamTex(); let m;
    if(kind==="matte") m=new THREE.MeshStandardMaterial({color:PINK,roughness:.62,bumpMap:tex,bumpScale:.05});
    else if(kind==="metal") m=new THREE.MeshPhysicalMaterial({color:PINK,metalness:1,roughness:.13,clearcoat:1,clearcoatRoughness:.05,envMapIntensity:1.3,bumpMap:tex,bumpScale:.09});
    else m=new THREE.MeshPhysicalMaterial({color:PINK,roughness:.08,metalness:0,transparent:true,opacity:.62,clearcoat:1,clearcoatRoughness:.05,envMapIntensity:1.2,depthWrite:false,side:THREE.DoubleSide,bumpMap:tex,bumpScale:.06});
    const mesh=new THREE.Mesh(new THREE.TubeGeometry(c,SEG,tube,RAD,true),m); if(kind==="glass") mesh.renderOrder=i; knot.add(mesh); return {tex,head:i/3}; });
  function size(){const w=cv.clientWidth;R.setSize(w,w,false);}
  addEventListener("resize",size); size();
  let last=performance.now();
  (function loop(t){const dt=Math.min(50,t-last);last=t;
    if(!reduce){ knot.rotation.y+=dt*.00012; knot.rotation.x+=dt*.00006; rings.forEach((r,i)=>{r.head+=dt*SPD[i]*2.2; r.tex.offset.x=-r.head;}); }
    R.render(S,cam); requestAnimationFrame(loop);})(last);
}
document.querySelectorAll("canvas").forEach(make);
</script><script data-goatcounter="https://transferenceworld.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
