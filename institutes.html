<script>
// [id, city, lane, start, end|null, name, parents[], founders, note]
const Y0=1900,Y1=2025,LEFT=118,RIGHT=24,LANE=30,BANDPAD=14,TOP=26,RHEAD=34;
const svg=document.getElementById("map"), card=document.getElementById("card");
const byId=Object.fromEntries(I.map(r=>[r[0],r]));
let mode="ic"; try{ const m=localStorage.getItem("tm-clinics"); mode=m==="1"?"ic":(["i","ic","c"].includes(m)?m:"ic"); }catch(_){}
const vis=r=>mode==="ic"||(mode==="c")===CLINICS.has(r[0]);
function draw(){
  const W=Math.max(980,svg.parentNode.clientWidth), px=(W-LEFT-RIGHT)/(Y1-Y0), X=y=>LEFT+(y-Y0)*px;
  // band positions
  // only what the toggle shows; lanes close up when clinics are hidden
  const V=I.filter(r=>vis(r)&&CITIES.includes(r[1])), LN={}, SHOWN=CITIES.filter(c=>V.some(r=>r[1]===c));
  SHOWN.forEach(c=>V.filter(r=>r[1]===c).sort((a,b)=>a[2]-b[2]).forEach((r,i)=>LN[r[0]]=i));
  const par=r=>r[6].filter(p=>vis(byId[p]));
  let y=TOP; const band={};
  const heads=[]; let prevG=null;
  SHOWN.forEach(c=>{ const g=REGION_OF[c]; if(g!==prevG){ heads.push({g,y}); y+=RHEAD; prevG=g; } const lanes=V.filter(r=>r[1]===c).length; band[c]={y, h:lanes*LANE+BANDPAD, first:heads.length&&heads[heads.length-1].y+RHEAD===y}; y+=lanes*LANE+BANDPAD; });
  const H=y+8, LY=r=>band[r[1]].y+BANDPAD/2+LN[r[0]]*LANE+LANE*.62;
  let s="";
  for(let d=Y0; d<=2020; d+=10){ s+=`<line x1="${X(d)}" x2="${X(d)}" y1="${TOP-6}" y2="${H}" stroke="${d%50?"#F0F0EC":"#E2E2DC"}"/><text class="yr" x="${X(d)}" y="14" text-anchor="middle">${d}</text>`; }
  heads.forEach(h=>{ s+=`<rect x="0" y="${h.y+4}" width="${W}" height="${RHEAD-4}" fill="var(--paper,#fff)"/><line x1="12" x2="${W-RIGHT}" y1="${h.y+RHEAD}" y2="${h.y+RHEAD}" stroke="#EF82C8" stroke-width="2.2" stroke-dasharray="0.1 6" stroke-linecap="round"/><text class="region" x="14" y="${h.y+RHEAD-9}">${h.g}</text>`; });
  SHOWN.forEach((c,i)=>{ const b=band[c]; if(i&&!b.first) s+=`<line x1="12" x2="${W-RIGHT}" y1="${b.y}" y2="${b.y}" stroke="#E2E2DC"/>`;
    s+=`<g class="band" data-city="${c}"><rect x="0" y="${b.y}" width="${LEFT-8}" height="${b.h}" fill="transparent"/><text class="city" x="14" y="${b.y+BANDPAD/2+LANE*.62+4}">${c}</text></g>`; });
  // a split branches off its parent line; a merger is two lines running together into one
  const BR=30, merged=new Set();
  V.forEach(r=>{ if(par(r).length>1) par(r).forEach(p=>{ if(byId[p][4]===r[3]) merged.add(p); }); });
  V.forEach(r=>{ const [id,c,l,a,e0,name]=r, unk=e0===-1, e=unk?a+12:e0, y0=LY(r), x0=X(a), x1=X(e||Y1), re=r[9], kids=par(r), cl=CLINICS.has(id);
    let seg="", br="", start=x0, dot=!kids.length;
    if(kids.length===1){ const P=byId[kids[0]], yp=LY(P), xs=Math.max(x0-BR,X(P[3])+2), m=(xs+x0)/2; br=`M${xs},${yp} C${m},${yp} ${m},${y0} ${x0},${y0} `; }
    else if(kids.length>1){ kids.forEach(p=>{ const yp=LY(byId[p]); br+=`M${x0-BR},${yp} C${x0-BR/2},${yp} ${x0-BR/2},${y0} ${x0},${y0} `; }); }
    seg+=re?`M${x0},${y0} L${x1},${y0} M${X(re)},${y0} L${X(Y1)},${y0}`:`M${x0},${y0} L${x1},${y0}`;
    const bar=e&&!unk&&!merged.has(id), end=merged.has(id)?x1-BR:x1;
    if(merged.has(id)) seg=seg.replace(`L${x1},${y0}`,`L${end},${y0}`);
    s+=`<g class="inst${cl?" clin":""}" data-id="${id}" data-city="${c}" tabindex="0" role="button" aria-label="${name}"><rect x="${x0-6}" y="${y0-16}" width="${(re?X(Y1):x1)-x0+12}" height="24" fill="transparent"/>
      ${unk?`<defs><linearGradient id="u_${id}" gradientUnits="userSpaceOnUse" x1="${x0}" y1="0" x2="${x1}" y2="0"><stop offset=".55" stop-color="${cl?"#0038FF":"#0E0E0E"}"/><stop offset="1" stop-color="${cl?"#0038FF":"#0E0E0E"}" stop-opacity="0"/></linearGradient></defs>`:""}<path class="ln${unk?" unk":""}" d="${seg}"${unk?` style="stroke:url(#u_${id})"`:""}/>${(!e||re)?`<path class="ln arw" d="M${X(Y1)-8},${y0-5.5} L${X(Y1)},${y0} L${X(Y1)-8},${y0+5.5}"/>`:""}${br?(()=>{ const FADE=110, g="g_"+id, xa=kids.length>1?x0-BR:Math.max(x0-BR,X(byId[kids[0]][3])+2), xb=Math.min(x0+FADE,x1);
        const mg=kids.length>1;
        return `<defs><linearGradient id="${g}" gradientUnits="userSpaceOnUse" x1="${xa}" y1="0" x2="${xb}" y2="0"><stop offset="0" stop-color="${mg?"#0038FF":"#FF5A1F"}"/><stop offset="1" stop-color="${cl?"#0038FF":"#0E0E0E"}"/></linearGradient></defs><path class="brn" stroke="url(#${g})"${cl?' style="stroke-width:1.5"':""} d="${br} M${x0},${y0} L${xb},${y0}"/>`; })():""}${bar?`<line class="bar" x1="${x1}" x2="${x1}" y1="${y0-6}" y2="${y0+6}" stroke="var(--ink)" stroke-width="2.4"/>`:""}
      ${dot?(cl?`<rect class="dot" x="${x0-3.6}" y="${y0-3.6}" width="7.2" height="7.2"/>`:`<circle class="dot" cx="${x0}" cy="${y0}" r="4.2"/>`):""}<text class="lab" x="${x0+14+name.length*6.4>W-RIGHT?x0-8:x0+8}" y="${y0-7}"${x0+14+name.length*6.4>W-RIGHT?' text-anchor="end"':""}>${name}</text></g>`; });
  svg.setAttribute("width",W); svg.setAttribute("height",H); svg.setAttribute("viewBox",`0 0 ${W} ${H}`); svg.innerHTML=s;
  // keep names clear of branch curves: slide a label right past any split that runs through it
  const curves=[...svg.querySelectorAll(".brn")].map(pth=>{ const b=pth.getBBox(); b.own=pth.closest(".inst").dataset.id; return b; });
  svg.querySelectorAll("text.lab").forEach(t=>{ if(t.getAttribute("text-anchor")==="end") return;
    for(let n=0;n<4;n++){ const b=t.getBBox(); const own=t.closest(".inst").dataset.id; const hit=curves.find(c=>c.own!==own && c.x<b.x+b.width+4 && c.x+Math.min(c.width,40)>b.x-4 && c.y<b.y+b.height && c.y+c.height>b.y+2);
      if(!hit) break; t.setAttribute("x", hit.x+Math.min(hit.width,40)+6); } });
  svg.querySelectorAll(".band").forEach(b=>{ const c=b.dataset.city;
    const on=()=>{ svg.classList.add("cityhl"); b.classList.add("hl"); svg.querySelectorAll(".inst").forEach(g=>g.classList.toggle("hl",g.dataset.city===c)); };
    const off=()=>{ svg.classList.remove("cityhl"); b.classList.remove("hl"); svg.querySelectorAll(".inst.hl").forEach(g=>g.classList.remove("hl")); };
    b.addEventListener("mouseenter",on); b.addEventListener("mouseleave",off); b.addEventListener("click",()=>b.classList.contains("hl")?off():on()); });
  svg.querySelectorAll(".inst").forEach(g=>{ g.onclick=()=>show(g.dataset.id); g.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); show(g.dataset.id);} }; });
  
}
let cur=null;
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function mark(id){ svg.querySelectorAll(".inst").forEach(g=>g.classList.toggle("on",g.dataset.id===id)); }
// founders link to their card on the Lines of Descent web, or else their school
const fold=t=>String(t).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z ]/g,"").trim();
const PEOPLE={}; (window.SEARCH||[]).forEach(([n,k,h])=>{ if(k==="School") return; const f=fold(n.replace(/\s*\(.*\)$/,"")); if(!PEOPLE[f]||k==="Analyst") PEOPLE[f]=h; });
const ALIAS={"a a brill":"abraham brill","jb pontalis":"jeanbertrand pontalis","c g jung":"carl gustav jung"};
function founders(t){ return t.split(/(,\s*|\s+and\s+|;\s*)/).map(part=>{ const raw=part.replace(/\s*\(.*?\)\s*$/,""), f=fold(raw), h=PEOPLE[f]||PEOPLE[ALIAS[f]];
    if(!h) return esc(part); return `<a href="${h}">${esc(raw)}</a>`+esc(part.slice(raw.length)); }).join(""); }
function show(id){ cur=id; mark(id); const r=byId[id], kids=I.filter(k=>k[6].includes(id)&&vis(k));
  const row=x=>`<button type="button" data-go="${x[0]}"><span>${esc(x[5])}</span><span>${x[3]}</span></button>`;
  card.innerHTML=`<button type="button" class="x" aria-label="Close">×</button><h2>${esc(r[5])}</h2>
   <div class="meta"><span class="tag fill">${esc(r[1])}</span><span class="tag">${r[3]}${r[4]===-1?"–?":r[4]?"–"+r[4]:"–present"}</span>${r[9]?`<span class="tag">Refounded ${r[9]}</span>`:""}</div>
   ${r[8]?`<p>${esc(r[8])}</p>`:""}
   ${r[7]?`<h3>Founders</h3><p class="fd">${founders(r[7])}</p>`:""}
   ${r[6].filter(p=>vis(byId[p])).length?`<h3>Came out of</h3><div class="list">${r[6].filter(p=>vis(byId[p])).map(p=>row(byId[p])).join("")}</div>`:""}
   ${kids.length?`<h3>Gave rise to</h3><div class="list">${kids.map(row).join("")}</div>`:""}`;
  card.hidden=false;
  const g=svg.querySelector(`.inst[data-id="${id}"]`), dot=g.querySelector("text.lab"), st=svg.parentNode.getBoundingClientRect(), bb=dot.getBoundingClientRect();
  const W=svg.parentNode.clientWidth, cw=card.offsetWidth;
  // on phones the map scrolls sideways, so the card opens centered on screen instead of under the line
  const sheet=innerWidth<760; card.classList.toggle("sheet",sheet);
  if(sheet){ card.style.left=""; card.style.top=""; card.scrollTop=0; }
  else { card.style.left=Math.max(16,Math.min(bb.left-st.left-10,W-cw-16))+"px"; card.style.top=(bb.bottom-st.top+22)+"px"; }
  card.querySelector(".x").onclick=close; }
function close(){ card.hidden=true; cur=null; mark(null); }
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!card.hidden) close(); });
document.addEventListener("click",e=>{ if(!card.hidden&&!card.contains(e.target)&&!e.target.closest(".inst")) close(); });
card.addEventListener("click",e=>{ const a=e.target.closest("[data-go]"); if(a){ e.preventDefault(); show(a.dataset.go); } });
const togs=[...document.querySelectorAll(".tog button")], keyEl=document.querySelector(".key");
function setTog(){ togs.forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.c===mode))); keyEl.classList.toggle("wc",mode!=="i"); }
togs.forEach(b=>b.onclick=()=>{ mode=b.dataset.c; try{ localStorage.setItem("tm-clinics",mode); }catch(_){} if(cur&&!vis(byId[cur])) close(); setTog(); draw(); if(cur) show(cur); });
setTog();
addEventListener("resize",()=>{ draw(); if(cur) show(cur); }); draw();
</script>
<script>(function(){
  const IS_MAP=location.pathname.endsWith("map.html");
  const ctl=document.createElement("div"); ctl.className="ctl";
  ctl.innerHTML=`<a class="vsw" href="${IS_MAP?"institutes.html":"map.html"}" role="switch" aria-checked="${IS_MAP?"false":"true"}" aria-label="Switch between map and timeline"><span class="${IS_MAP?"":"dim"}">Map</span><span class="trk${IS_MAP?"":" r"}"><i></i></span><span class="${IS_MAP?"dim":""}">Timeline</span></a>
  <div class="fsw" role="group" aria-label="Show"><button type="button" data-k="i" role="switch"><span class="trk r"><i></i></span><span>Institutes</span></button><button type="button" data-k="c" role="switch"><span class="trk r"><i></i></span><span>Clinics / Asylums</span></button></div>`;
  const anchor=document.querySelector(".viewtog"); anchor.parentNode.insertBefore(ctl,anchor);
  const getMode=()=>{ try{ const m=localStorage.getItem("tm-clinics"); return m==="1"?"ic":(["i","c","ic"].includes(m)?m:"ic"); }catch(_){ return "ic"; } };
  const btns=[...ctl.querySelectorAll(".fsw button")];
  function render(){ const m=getMode(); btns.forEach(b=>{ const on=m.includes(b.dataset.k); b.setAttribute("aria-checked",String(on)); b.querySelector(".trk").className="trk"+(on?" r":" off"); b.querySelector("span:last-child").className=on?"":"dim"; }); }
  btns.forEach(b=>b.onclick=()=>{ const m=getMode(); let i=m.includes("i"), c=m.includes("c");
    if(b.dataset.k==="i") i=!i; else c=!c; if(!i&&!c){ if(b.dataset.k==="i") c=true; else i=true; }
    const nm=i&&c?"ic":(i?"i":"c"); const t=document.querySelector(`.tog button[data-c="${nm}"]`); if(t) t.click(); try{ localStorage.setItem("tm-clinics",nm); }catch(_){} render(); });
  render();
})();</script>
