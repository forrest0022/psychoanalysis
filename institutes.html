<script>
// [id, city, lane, start, end|null, name, parents[], founders, note]
const I=[
 ["wpv","Vienna",0,1902,1938,"Vienna Psychoanalytic Society",[],"Sigmund Freud","Began as Freud's Wednesday Psychological Society in 1902 and took this name in 1908. Dissolved after the Anschluss in 1938; refounded in 1946 under August Aichhorn.",1946],
 ["sexpol","Vienna",2,1929,1934,"Sex-Pol clinics",[],"Wilhelm Reich","Free sexual counseling and mental-health clinics for working people, started by Reich in Vienna in 1929 and extended to Berlin; ended in 1934."],
 ["amb","Vienna",1,1922,1938,"Vienna Ambulatorium",["wpv"],"Eduard Hitschmann","The society's free outpatient clinic, opened on May 22, 1922, and closed after the Anschluss in 1938."],
 ["hun","Budapest",0,1913,1949,"Hungarian Psychoanalytical Society",[],"Sándor Ferenczi","Founded quickly by Ferenczi in 1913 to give Freud another voting bloc in the coming showdown with Jung. Home of the Budapest school; forced to dissolve under the Communist government in 1949."],
 ["bfc","Budapest",1,1929,1949,"Budapest Free Clinic",["hun"],"Sándor Ferenczi","Ferenczi opened the free outpatient clinic he had long planned in 1929, with Michael Bálint among its analysts. It closed in 1949, when the Communist government forced the Hungarian society to dissolve."],
 ["zfc","Zagreb",0,1928,1941,"Zagreb Free Clinic",[],"Stjepan Betlheim and others","A free psychoanalytic clinic founded in 1928 by Betlheim, who had trained in Vienna. It ended in 1941, when the fascist Independent State of Croatia took power: Betlheim, who was Jewish, was barred from public work and sent with other Jewish doctors to Bosnia, and later escaped to join the Partisans. After the war he founded Croatia's first outpatient psychotherapy ward, in 1953."],
 ["ffmc","Frankfurt",1,1930,1933,"Frankfurt Psychoanalytic Clinic",["ffm"],"Karl Landauer, Heinrich Meng; S. H. Foulkes, director","The outpatient clinic of the Frankfurt Institute and the last of the interwar free clinics, with close ties to the university and Horkheimer's Institute for Social Research. It lasted only a few years before the Nazis closed it."],
 ["bpv","Berlin",0,1908,1938,"Berlin Psychoanalytic Society",[],"Karl Abraham","Founded the year Abraham moved to Berlin from Zurich. The first psychoanalytic society outside Vienna. Taken over under the Nazi regime and dissolved in 1938."],
 ["poli","Berlin",1,1920,1933,"Berlin Poliklinik and Institute",["bpv"],"Max Eitingon, Ernst Simmel, Karl Abraham","The first psychoanalytic free clinic and the first training institute. It pioneered time-limited analysis and standardized training (personal analysis, supervision, seminars), the model institutes still follow. Aryanized in 1933, then folded into the Nazi-run Göring Institute in 1936."],
 ["tegel","Berlin",3,1927,1931,"Schloss Tegel Sanatorium",[],"Ernst Simmel","The first psychoanalytic inpatient clinic, opened April 10, 1927, in a manor outside Berlin. Freud stayed there while being treated in the city. It closed in 1931 for lack of money."],
 ["dpv","Berlin",2,1950,null,"German Psychoanalytical Association (DPV)",[],"Carl Müller-Braunschweig","Founded after the war and admitted to the IPA."],
 ["ffm","Frankfurt",0,1929,1933,"Frankfurt Psychoanalytic Institute",[],"Karl Landauer, Frieda Fromm-Reichmann, Heinrich Meng","Founded February 10, 1929, as the institute of the Southwest German Psychoanalytic Working Group, and housed beside the Institute for Social Research, where analysts and the Frankfurt School sociologists met. Erich Fromm and S. H. Foulkes taught here. Closed when the Nazis came to power."],
 ["sgp","Zurich",0,1919,null,"Swiss Society for Psychoanalysis",[],"Oskar Pfister, Emil Oberholzer","A non-Jungian society, founded in 1919 after Jung's break with Freud had taken the earlier Zurich group with him."],
 ["jung","Zurich",1,1948,null,"C. G. Jung Institute",[],"C. G. Jung","Training institute for analytical psychology."],
 ["tav","London",3,1920,null,"Tavistock Clinic",[],"Hugh Crichton-Miller","Opened in 1920 to treat shell shock and other neuroses without fees; later home to Bion's group work, Balint groups and Bowlby."],
 ["kh","London",4,1965,1970,"Kingsley Hall",[],"R. D. Laing and the Philadelphia Association","A community in East London where people in psychosis lived alongside therapists, outside hospital routine. It closed in 1970."],
 ["wtc","London",5,1976,null,"Women's Therapy Centre",[],"Susie Orbach, Luise Eichenbaum","A feminist psychoanalytic clinic for women, founded in 1976."],
 ["bps","London",0,1913,null,"British Psychoanalytical Society",[],"Ernest Jones","Founded by Jones with nine members after the 1913 Munich congress, following Ferenczi's lead, as the London Psycho-Analytical Society; refounded under this name in 1919; its Institute of Psychoanalysis opened in 1924. After the Controversial Discussions it settled in 1946 into three groups: Kleinian, Independent and Anna Freud's."],
 ["lcp","London",1,1926,null,"London Clinic of Psychoanalysis",["bps"],"Ernest Jones","The British Society's free clinic, opened in 1926 on the Berlin model."],
 ["afc","London",2,1947,null,"Anna Freud Centre",[],"Anna Freud","Began as the Hampstead Child Therapy Course in 1947, with a clinic from 1952."],
 ["spp","Paris",0,1926,null,"Société Psychanalytique de Paris",[],"Marie Bonaparte, René Laforgue, Rudolph Loewenstein and others","The first French society."],
 ["sfp","Paris",1,1953,1965,"Société Française de Psychanalyse",["spp"],"Daniel Lagache, Jacques Lacan, Françoise Dolto, Juliette Favez-Boutonier","Broke from the SPP in 1953 over training and Lacan's short sessions. Dissolved once the IPA required Lacan's removal as a training analyst."],
 ["apf","Paris",2,1964,null,"Association Psychanalytique de France",["sfp"],"Daniel Lagache, Jean Laplanche, J.-B. Pontalis, Didier Anzieu","The SFP members who stayed with the IPA."],
 ["efp","Paris",3,1964,1980,"École Freudienne de Paris",["sfp"],"Jacques Lacan","Lacan's school, dissolved by Lacan in 1980."],
 ["q4","Paris",4,1969,null,"Quatrième Groupe",["efp"],"Piera Aulagnier, François Perrier, Jean-Paul Valabrega","Left the EFP over the pass, Lacan's procedure for becoming an analyst."],
 ["ecf","Paris",5,1981,null,"École de la Cause freudienne",["efp"],"Jacques-Alain Miller and Lacan's circle","Formed after the EFP's dissolution."],
 ["ipso","Paris",6,1972,null,"Institut de psychosomatique (IPSO)",[],"Pierre Marty, Michel Fain","Home of the Paris school of psychosomatics, built on Marty, de M'Uzan and David's L'Investigation psychosomatique (1963). Its hospital, opened in 1978, now bears Marty's name."],
 ["stalban","Saint-Alban",0,1940,null,"Saint-Alban Hospital",[],"François Tosquelles","A rural psychiatric hospital in the Lozère where Tosquelles, a refugee from the Spanish Civil War, began institutional psychotherapy during the Occupation. Frantz Fanon trained here."],
 ["laborde","Cour-Cheverny",0,1953,null,"La Borde Clinic",[],"Jean Oury","Founded by Oury, who had trained with Tosquelles at Saint-Alban. Félix Guattari worked here from 1955; patients and staff share in running the clinic."],
 ["pps","Jerusalem",0,1933,null,"Palestine (later Israel) Psychoanalytic Society",[],"Max Eitingon","Founded by Eitingon after he left Berlin in 1933; it later became the Israel Psychoanalytic Society, with its own institute."],
 ["nyps","New York",0,1911,null,"New York Psychoanalytic Society and Institute (NYPSI)",[],"A. A. Brill","The first psychoanalytic society in the United States. Its institute was organized in 1931 by Sándor Radó on the Berlin model."],
 ["aip","New York",2,1941,null,"American Institute for Psychoanalysis",["nyps"],"Karen Horney, Clara Thompson and others","On April 29, 1941, the New York society demoted Horney to lecturer. She, Clara Thompson and three younger analysts walked out and founded the American Association for the Advancement of Psychoanalysis, with this institute as its training arm."],
 ["wawi","New York",3,1943,null,"William Alanson White Institute",["aip"],"Clara Thompson, Erich Fromm, Harry Stack Sullivan, Frieda Fromm-Reichmann, David and Janet Rioch","In 1943 Fromm and Thompson left Horney's group, partly over Fromm's standing as a non-physician training analyst, and with Sullivan opened a New York branch of the Washington-based William Alanson White Psychiatric Foundation. Thompson renamed it the William Alanson White Institute in 1946. The home of interpersonal psychoanalysis."],
 ["col","New York",1,1945,null,"Columbia Psychoanalytic Center",["nyps"],"Sándor Radó, Abram Kardiner, David Levy, George Daniels","The first university-based psychoanalytic training center, founded by analysts who left the New York Institute."],
 ["nyu","New York",7,1961,null,"NYU Postdoctoral Program",[],"Bernard Kalinkowitz","Trained psychologists when medical institutes would not; later the birthplace of relational psychoanalysis."],
 ["npap","New York",4,1948,null,"National Psychological Association for Psychoanalysis (NPAP)",[],"Theodor Reik and a group of his students","Founded to train non-physicians, in the spirit of Freud's The Question of Lay Analysis; runs the Theodor Reik Clinical Center and publishes The Psychoanalytic Review."],
 ["nyfs","New York",5,1959,null,"Contemporary Freudian Society",["npap"],"Gisela Barinbaum","Began in 1959 as the New York Society of Freudian Psychologists, split from NPAP; later the New York Freudian Society, now the Contemporary Freudian Society."],
 ["iptar","New York",6,1958,null,"Institute for Psychoanalytic Training and Research (IPTAR)",["npap"],"NPAP-trained analysts","Founded in 1958 as a membership society for analysts interested in Freud's theory and technique."],
 ["cmps","New York",8,1971,null,"Center for Modern Psychoanalytic Studies (CMPS)",[],"Phyllis Meadow, Selwyn Brody, Louis and Joan Ormont, Harold Stern and others","Home of modern psychoanalysis, built on Hyman Spotnitz's work with severe disturbance."],
 ["bos","Boston",0,1914,null,"Boston Psychoanalytic Society",[],"James Jackson Putnam, Isador Coriat","Founded in May 1914, the second society in the United States. Émigrés including Hanns Sachs, Helene Deutsch and Eduard Hitschmann trained analysts here."],
 ["pps","Philadelphia",0,1937,2001,"Philadelphia Psychoanalytic Society and Institute",[],"O. Spurgeon English, Sidney G. Biddle, LeRoy M. A. Maeder, George W. Smeltz, Robert Waelder","Founded October 27, 1937, and accepted by the American Psychoanalytic Association in 1939. Waelder, who arrived from Vienna by way of Boston in 1943, became a training analyst at its institute."],
 ["pap","Philadelphia",1,1949,2001,"Philadelphia Association for Psychoanalysis",["pps"],"","Broke away from the Philadelphia Psychoanalytic Institute and Society in 1949, over differences between liberal and conservative camps as well as personal conflicts. Robert Waelder later served as its president, 1953–55."],
 ["pcop","Philadelphia",2,2001,null,"Psychoanalytic Center of Philadelphia",["pps","pap"],"","The two Philadelphia groups voted to reunite in 2001, ending the split of 1949."],
 ["wbps","Washington–Baltimore",0,1930,null,"Washington–Baltimore Psychoanalytic Society",[],"Clara Thompson (first president), Harry Stack Sullivan","Founded in 1930 and accredited by the American Psychoanalytic Association in 1932. Frieda Fromm-Reichmann, of nearby Chestnut Lodge, was its president from 1939 to 1941."],
 ["wsp","Washington–Baltimore",1,1936,null,"Washington School of Psychiatry",[],"Harry Stack Sullivan","Sullivan's school for interpersonal psychiatry; its New York branch became the William Alanson White Institute."],
 ["riggs","Stockbridge",0,1919,null,"Austen Riggs Center",[],"Austen Fox Riggs","An open psychiatric hospital in the Berkshires; Erik Erikson, David Rapaport and Robert Knight worked here."],
 ["chestnut","Washington–Baltimore",2,1910,2001,"Chestnut Lodge",[],"Ernest Bullard; later Dexter Bullard","A private hospital in Rockville, Maryland, that became the leading center for psychoanalytic treatment of schizophrenia, with Frieda Fromm-Reichmann and Harry Stack Sullivan. It closed in 2001."],
 ["menn","Topeka",0,1925,null,"Menninger Clinic",[],"Karl, William and Charles Menninger","A family psychiatric hospital that became a center of American psychoanalytic psychiatry; moved to Houston in 2003."],
 ["topeka","Topeka",1,1942,null,"Topeka Institute for Psychoanalysis",["menn"],"Karl Menninger","The training institute founded inside the Menninger Clinic."],
 ["chi","Chicago",0,1932,null,"Chicago Institute for Psychoanalysis",[],"Franz Alexander","Founded by Alexander, who came from Berlin in 1930 and stayed after Hitler took power; he left for Los Angeles in 1953. Heinz Kohut trained and taught here and developed self psychology here in the 1970s. Chicago largely avoided the splits of other cities."],
 ["lafargue","New York",9,1946,1958,"Lafargue Clinic",[],"Fredric Wertham, with Richard Wright and Ralph Ellison","A free psychiatric clinic in the basement of a Harlem church, open to anyone at a time when Black New Yorkers had almost no access to psychotherapy. It closed in 1958."],
 ["la","Los Angeles",0,1935,2005,"Los Angeles Psychoanalytic Society and Institute",[],"Ernst Simmel, Otto Fenichel, Frances Deri","Began in 1935 as the Psychoanalytic Study Group of Los Angeles, with Simmel, who had arrived from Berlin in 1934, as president; Fenichel came to teach in 1938. Lay analysts trained alongside physicians, a point of conflict with the American Psychoanalytic Association."],
 ["scp","Los Angeles",1,1950,2005,"Southern California Psychoanalytic Institute",["la"],"","Split from the Los Angeles society in 1950 over its many lay analysts. The breakaway group called itself the Society for Psychoanalytic Medicine of Southern California to stress its medical identity, and later dropped \"Medicine\" from its name."],
 ["ncp","Los Angeles",2,2005,null,"New Center for Psychoanalysis",["la","scp"],"","The two Los Angeles institutes merged in 2005."],
 ["laisps","Los Angeles",3,1970,null,"Los Angeles Institute and Society for Psychoanalytic Studies (LAISPS)",[],"Hedda Bolgar, Jean Sanville, Joel Shor, Charles Ansell and others","Grew out of the Los Angeles Society for Psychoanalytic Psychology (1968), formed by psychologists when the medical institutes would not train them. Its institute opened in 1970, was named LAIPS in 1978 and LAISPS in 1985; training open to psychologists, social workers and MFTs."],
 ["pcc","Los Angeles",4,1984,null,"Psychoanalytic Center of California (PCC)",[],"James Gooch (first president); Richard Alexander (founding dean)","A Kleinian and Bionian institute, first recognized in 1984 and independent from 1987. Members of both older Los Angeles institutes joined it."],
 ["icp","Los Angeles",5,1990,null,"Institute of Contemporary Psychoanalysis (ICP)",[],"","Founded in 1990."],
 ["sf","San Francisco",0,1942,null,"San Francisco Psychoanalytic Society and Institute",[],"William Barrett, Bernhard Berliner, Otto Fenichel, George Gero, Bernard Kamm, Jascha Kasanin, Donald McFarlane, Douglass Orr, Ernst Simmel, Emanuel Windholz","Founded March 8, 1942, by ten physicians from San Francisco and Los Angeles, under the Topeka society's supervision. Lay analysts could be members but could not vote or hold office. Grew out of an informal study group of the late 1930s."],
 ["pinc","San Francisco",1,1989,null,"Psychoanalytic Institute of Northern California (PINC)",[],"","Created in 1989 by people involved in the lawsuit that opened psychoanalytic training to non-physicians, with help from senior members of the San Francisco Institute. A center for comparative psychoanalysis; an IPA component society since 2009."],
 ["apm","Mexico City",0,1957,null,"Asociación Psicoanalítica Mexicana",[],"","Became Mexico's first IPA society in 1957. Marie Langer worked in Mexico City after leaving Argentina in 1974."],
 ["apa","Buenos Aires",0,1942,null,"Asociación Psicoanalítica Argentina",[],"Ángel Garma, Celes Cárcamo, Marie Langer, Enrique Pichon-Rivière, Arnaldo Rascovsky, Guillermo Ferrari Hardoy","The first Latin American society; home of the Barangers' field theory."],
 ["apdeba","Buenos Aires",1,1977,null,"Asociación Psicoanalítica de Buenos Aires",["apa"],"","Split from the APA in 1977."],
 ["platdoc","Buenos Aires",2,1971,-1,"Plataforma and Documento",["apa"],"Marie Langer, Diego and Gilou García Reynoso and others","Left-wing groups that broke from the APA in 1971 over its politics and training hierarchy."],
 ["apu","Montevideo",0,1955,null,"Asociación Psicoanalítica del Uruguay",[],"Willy and Madeleine Baranger, with a group of Uruguayan doctors and psychologists","Founded September 27, 1955, after Willy Baranger was invited to lead training in Montevideo; recognized by the IPA as a study group in 1957."],
 ["sbp","São Paulo",0,1951,null,"Brazilian Psychoanalytic Society of São Paulo",[],"Adelheid Koch","Koch, trained in Berlin, arrived in 1936 and built the group that became Brazil's first society."],
 ["sprj","Rio de Janeiro",0,1955,null,"Sociedade Psicanalítica do Rio de Janeiro",[],"Werner Kemper, Kattrin Kemper, Fabio Leite Lobo, Gerson Borsoi, Inaura Carneiro Leão Vetter, Luiz Guimarães Dahlheim, Noemy Rudolfer","Affiliated with the IPA in 1955. Werner Kemper had trained in Berlin."],
 ["asovep","Caracas",0,1965,null,"Asociación Venezolana de Psicoanálisis",[],"Julio Aray, Antonio Briceño, Nicolás Cupello, Hugo Domínguez, Juan Antonio Olivares, Hans Voss and others","Recognized by the IPA as a working group in 1965; became an association in 1969 and an IPA society in 1971."],
 ["ips","Kolkata",0,1922,null,"Indian Psychoanalytical Society",[],"Girindrasekhar Bose","The first society in Asia."],
 ["jps","Tokyo",0,1955,null,"Japan Psychoanalytic Society",[],"Heisaku Kosawa",""]
];
const CITIES=["Vienna","Budapest","Zagreb","Berlin","Frankfurt","Zurich","London","Paris","Saint-Alban","Cour-Cheverny","Jerusalem","New York","Boston","Stockbridge","Philadelphia","Washington–Baltimore","Topeka","Chicago","Los Angeles","San Francisco","Mexico City","Buenos Aires","Montevideo","São Paulo","Rio de Janeiro","Caracas","Kolkata","Tokyo"];
const Y0=1900,Y1=2025,LEFT=118,RIGHT=24,LANE=30,BANDPAD=14,TOP=26;
const svg=document.getElementById("map"), card=document.getElementById("card");
const byId=Object.fromEntries(I.map(r=>[r[0],r]));
const CLINICS=new Set(["bfc","zfc","ffmc","amb","lcp","sexpol","tegel","tav","kh","wtc","stalban","laborde","riggs","chestnut","menn","lafargue"]);
let mode="i"; try{ const m=localStorage.getItem("tm-clinics"); mode=m==="1"?"ic":(["i","ic","c"].includes(m)?m:"i"); }catch(_){}
const vis=r=>mode==="ic"||(mode==="c")===CLINICS.has(r[0]);
function draw(){
  const W=Math.max(980,svg.parentNode.clientWidth), px=(W-LEFT-RIGHT)/(Y1-Y0), X=y=>LEFT+(y-Y0)*px;
  // band positions
  // only what the toggle shows; lanes close up when clinics are hidden
  const V=I.filter(vis), LN={}, SHOWN=CITIES.filter(c=>V.some(r=>r[1]===c));
  SHOWN.forEach(c=>V.filter(r=>r[1]===c).sort((a,b)=>a[2]-b[2]).forEach((r,i)=>LN[r[0]]=i));
  const par=r=>r[6].filter(p=>vis(byId[p]));
  let y=TOP; const band={};
  SHOWN.forEach(c=>{ const lanes=V.filter(r=>r[1]===c).length; band[c]={y, h:lanes*LANE+BANDPAD}; y+=lanes*LANE+BANDPAD; });
  const H=y+8, LY=r=>band[r[1]].y+BANDPAD/2+LN[r[0]]*LANE+LANE*.62;
  let s="";
  for(let d=Y0; d<=2020; d+=10){ s+=`<line x1="${X(d)}" x2="${X(d)}" y1="${TOP-6}" y2="${H}" stroke="${d%50?"#F0F0EC":"#E2E2DC"}"/><text class="yr" x="${X(d)}" y="14" text-anchor="middle">${d}</text>`; }
  SHOWN.forEach((c,i)=>{ const b=band[c]; if(i) s+=`<line x1="12" x2="${W-RIGHT}" y1="${b.y}" y2="${b.y}" stroke="#E2E2DC"/>`;
    s+=`<g class="band"><text class="city" x="14" y="${b.y+BANDPAD/2+LANE*.62+4}">${c}</text></g>`; });
  // a split branches off its parent line; a merger is two lines running together into one
  const BR=30, merged=new Set();
  V.forEach(r=>{ if(par(r).length>1) par(r).forEach(p=>{ if(byId[p][4]===r[3]) merged.add(p); }); });
  V.forEach(r=>{ const [id,c,l,a,e0,name]=r, unk=e0===-1, e=unk?a+12:e0, y0=LY(r), x0=X(a), x1=X(e||Y1), re=r[9], kids=par(r), cl=CLINICS.has(id);
    let seg="", br="", start=x0, dot=!kids.length;
    if(kids.length===1){ const P=byId[kids[0]], yp=LY(P), xs=Math.max(x0-BR,X(P[3])+2), m=(xs+x0)/2; br=`M${xs},${yp} C${m},${yp} ${m},${y0} ${x0},${y0} `; }
    else if(kids.length>1){ kids.forEach(p=>{ const yp=LY(byId[p]); br+=`M${x0-BR},${yp} C${x0-BR/2},${yp} ${x0-BR/2},${y0} ${x0},${y0} `; }); }
    seg+=re?`M${x0},${y0} L${x1},${y0} M${X(re)},${y0} L${X(Y1)},${y0}`:`M${x0},${y0} L${x1},${y0}`;
    const bar=e&&!unk&&!merged.has(id), end=merged.has(id)?x1-BR:x1;
    if(merged.has(id)) seg=seg.replace(`L${x1},${y0}`,`L${end},${y0}`);
    s+=`<g class="inst${cl?" clin":""}" data-id="${id}" tabindex="0" role="button" aria-label="${name}"><rect x="${x0-6}" y="${y0-16}" width="${(re?X(Y1):x1)-x0+12}" height="24" fill="transparent"/>
      ${unk?`<defs><linearGradient id="u_${id}" gradientUnits="userSpaceOnUse" x1="${x0}" y1="0" x2="${x1}" y2="0"><stop offset=".55" stop-color="${cl?"#EF82C8":"#0E0E0E"}"/><stop offset="1" stop-color="${cl?"#EF82C8":"#0E0E0E"}" stop-opacity="0"/></linearGradient></defs>`:""}<path class="ln${unk?" unk":""}" d="${seg}"${unk?` style="stroke:url(#u_${id})"`:""}/>${(!e||re)?`<path class="ln arw" d="M${X(Y1)-8},${y0-5.5} L${X(Y1)},${y0} L${X(Y1)-8},${y0+5.5}"/>`:""}${br?(()=>{ const FADE=110, g="g_"+id, xa=kids.length>1?x0-BR:Math.max(x0-BR,X(byId[kids[0]][3])+2), xb=Math.min(x0+FADE,x1);
        const mg=kids.length>1;
        return `<defs><linearGradient id="${g}" gradientUnits="userSpaceOnUse" x1="${xa}" y1="0" x2="${xb}" y2="0"><stop offset="0" stop-color="${mg?"#0038FF":"#FF5A1F"}"/><stop offset="1" stop-color="${cl?"#EF82C8":"#0E0E0E"}"/></linearGradient></defs><path class="brn" stroke="url(#${g})"${cl?' style="stroke-width:1.5"':""} d="${br} M${x0},${y0} L${xb},${y0}"/>`; })():""}${bar?`<line class="bar" x1="${x1}" x2="${x1}" y1="${y0-6}" y2="${y0+6}" stroke="var(--ink)" stroke-width="2.4"/>`:""}
      ${dot?(cl?`<rect class="dot" x="${x0-3.6}" y="${y0-3.6}" width="7.2" height="7.2"/>`:`<circle class="dot" cx="${x0}" cy="${y0}" r="4.2"/>`):""}<text class="lab" x="${x0>W-200?x0-8:x0+8}" y="${y0-7}"${x0>W-200?' text-anchor="end"':""}>${name}</text></g>`; });
  svg.setAttribute("width",W); svg.setAttribute("height",H); svg.setAttribute("viewBox",`0 0 ${W} ${H}`); svg.innerHTML=s;
  // keep names clear of branch curves: slide a label right past any split that runs through it
  const curves=[...svg.querySelectorAll(".brn")].map(pth=>{ const b=pth.getBBox(); b.own=pth.closest(".inst").dataset.id; return b; });
  svg.querySelectorAll("text.lab").forEach(t=>{ if(t.getAttribute("text-anchor")==="end") return;
    for(let n=0;n<4;n++){ const b=t.getBBox(); const own=t.closest(".inst").dataset.id; const hit=curves.find(c=>c.own!==own && c.x<b.x+b.width+4 && c.x+Math.min(c.width,40)>b.x-4 && c.y<b.y+b.height && c.y+c.height>b.y+2);
      if(!hit) break; t.setAttribute("x", hit.x+Math.min(hit.width,40)+6); } });
  svg.querySelectorAll(".inst").forEach(g=>{ g.onclick=()=>show(g.dataset.id); g.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); show(g.dataset.id);} }; });
  
}
let cur=null;
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function mark(id){ svg.querySelectorAll(".inst").forEach(g=>g.classList.toggle("on",g.dataset.id===id)); }
// founders link to their card on the Lines of Descent web, or else their school
const fold=t=>String(t).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z ]/g,"").trim();
const PEOPLE={}; (window.SEARCH||[]).forEach(([n,k,h])=>{ if(k==="School") return; const f=fold(n.replace(/\s*\(.*\)$/,"")); if(!PEOPLE[f]||k==="Analyst") PEOPLE[f]=h; });
const ALIAS={"a a brill":"abraham brill","jb pontalis":"jeanbertrand pontalis","c g jung":"carl gustav jung"};
function founders(t){ return t.split(/(,\s*|\s+and\s+|;\s*)/).map(part=>{ const raw=part.replace(/\s*\(.*?\)\s*$/,""), f=fold(raw), h=PEOPLE[f]||PEOPLE[ALIAS[f]];
    if(!h) return esc(part); return `<a href="${h}">${esc(raw)}</a>`+esc(part.slice(raw.length)); }).join(""); }
function show(id){ cur=id; mark(id); const r=byId[id], kids=I.filter(k=>k[6].includes(id)&&vis(k));
  const row=x=>`<button type="button" data-go="${x[0]}"><span>${esc(x[5])}</span><span>${x[3]}</span></button>`;
  card.innerHTML=`<button type="button" class="x" aria-label="Close">×</button><h2>${esc(r[5])}</h2>
   <div class="meta"><span class="tag fill">${esc(r[1])}</span><span class="tag">${r[3]}${r[4]===-1?"–?":r[4]?"–"+r[4]:"–present"}</span>${r[9]?`<span class="tag">Refounded ${r[9]}</span>`:""}</div>
   ${r[8]?`<p>${esc(r[8])}</p>`:""}
   ${r[7]?`<h3>Founders</h3><p class="fd">${founders(r[7])}</p>`:""}
   ${r[6].filter(p=>vis(byId[p])).length?`<h3>Came out of</h3><div class="list">${r[6].filter(p=>vis(byId[p])).map(p=>row(byId[p])).join("")}</div>`:""}
   ${kids.length?`<h3>Gave rise to</h3><div class="list">${kids.map(row).join("")}</div>`:""}`;
  card.hidden=false;
  const g=svg.querySelector(`.inst[data-id="${id}"]`), dot=g.querySelector("text.lab"), st=svg.parentNode.getBoundingClientRect(), bb=dot.getBoundingClientRect();
  const W=svg.parentNode.clientWidth, cw=card.offsetWidth;
  // on phones the map scrolls sideways, so the card opens centered on screen instead of under the line
  const sheet=innerWidth<760; card.classList.toggle("sheet",sheet);
  if(sheet){ card.style.left=""; card.style.top=""; card.scrollTop=0; }
  else { card.style.left=Math.max(16,Math.min(bb.left-st.left-10,W-cw-16))+"px"; card.style.top=(bb.bottom-st.top+22)+"px"; }
  card.querySelector(".x").onclick=close; }
function close(){ card.hidden=true; cur=null; mark(null); }
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!card.hidden) close(); });
document.addEventListener("click",e=>{ if(!card.hidden&&!card.contains(e.target)&&!e.target.closest(".inst")) close(); });
card.addEventListener("click",e=>{ const a=e.target.closest("[data-go]"); if(a){ e.preventDefault(); show(a.dataset.go); } });
const togs=[...document.querySelectorAll(".tog button")], keyEl=document.querySelector(".key");
function setTog(){ togs.forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.c===mode))); keyEl.classList.toggle("wc",mode!=="i"); }
togs.forEach(b=>b.onclick=()=>{ mode=b.dataset.c; try{ localStorage.setItem("tm-clinics",mode); }catch(_){} if(cur&&!vis(byId[cur])) close(); setTog(); draw(); if(cur) show(cur); });
setTog();
addEventListener("resize",()=>{ draw(); if(cur) show(cur); }); draw();
</script><script src="search.js"></script>
